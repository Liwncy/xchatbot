definitions:
  basev3.BaseResponse:
    properties:
      code:
        description: 返回码，0 表示成功
        type: integer
      message:
        allOf:
        - $ref: '#/definitions/wrapperspb.StringValue'
        description: 错误信息
    type: object
  basev3.Buffer:
    properties:
      data:
        description: 数据内容
        items:
          type: integer
        type: array
      size:
        description: 数据长度
        type: integer
    type: object
  basev3.Commands_Item:
    properties:
      buffer:
        allOf:
        - $ref: '#/definitions/basev3.Buffer'
        description: 命令数据
      id:
        description: 命令 ID
        type: integer
    type: object
  basev3.Gender:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - Gender_UNKNOWN_GENDER
    - Gender_MALE
    - Gender_FEMALE
  basev3.OperateResponse:
    properties:
      code:
        description: 返回码
        type: integer
      result:
        allOf:
        - $ref: '#/definitions/basev3.OperateResponse_Result'
        description: 操作返回结果
    type: object
  basev3.OperateResponse_Result:
    properties:
      codes:
        description: 与命令顺序对应的返回码
        items:
          type: integer
        type: array
      count:
        description: 操作结果数量
        type: integer
      messages:
        description: 与命令顺序对应的错误信息
        items:
          $ref: '#/definitions/basev3.OperateResponse_Result_ErrorMessage'
        type: array
    type: object
  basev3.OperateResponse_Result_ErrorMessage:
    properties:
      content:
        description: 错误正文
        type: string
      title:
        description: 错误标题
        type: string
    type: object
  basev3.TextBuffer:
    properties:
