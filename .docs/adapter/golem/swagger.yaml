        required: true
        type: string
      - description: 表情 MD5 值，与 url、file 至少提供一项
        in: formData
        name: md5
        type: string
      - description: 表情 URL，与 md5、file 至少提供一项
        in: formData
        name: url
        type: string
      - description: 表情文件，与 md5、url 至少提供一项
        in: formData
        name: file
        type: file
