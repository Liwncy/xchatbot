  /api/moments:
    post:
      consumes:
      - multipart/form-data
      description: 图片文件按请求顺序，随后按 images_url 顺序发布，合计最多 9 张；图片与视频互斥。视频和封面优先使用文件，否则下载对应
        URL；缺少封面时通过 FFmpeg 或 sprocket 自动生成。
      parameters:
      - description: 文字；文字、图片、视频至少提供一项
        in: formData
        name: content
        type: string
      - description: 图片文件，重复同名字段上传多张，按请求顺序发布，最多 9 张
        in: formData
        name: images
        type: file
      - description: 图片 URL，半角逗号分隔，与图片文件合计最多 9 张
        in: formData
        name: images_url
        type: string
      - description: 视频文件，不能与图片同时上传
        in: formData
        name: video
        type: file
      - description: 视频 URL，video 文件优先
        in: formData
        name: video_url
        type: string
      - description: 视频封面文件，可选
        in: formData
        name: cover
        type: file
      - description: 视频封面 URL，cover 文件优先，均为空时自动提取
        in: formData
        name: cover_url
        type: string
      - description: 0 公开（默认）、1 私密、2 部分可见、3 不给谁看
        in: formData
        name: privacy
        type: integer
      - description: 部分可见的用户名列表，privacy=2 时必填
        in: formData
        name: visible_users
        type: string
      - description: 不可见的用户名列表，privacy=3 时必填
        in: formData
        name: blacklist
        type: string
      - description: 提醒谁看，必须在可见范围内
        in: formData
        name: with_users
        type: string
      - description: 来源应用名称；移动端通常按 app_id 查询应用资料名称
        in: formData
        name: app_name
        type: string
      - description: 微信开放平台应用 ID
        in: formData
        name: app_id
        type: string
      - description: 本次发布的客户端请求标识；省略时自动生成，同一次请求重试时可复用
        in: formData
        name: client_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/momentsv3.PostResponse'
              type: object
      summary: 发布朋友圈
