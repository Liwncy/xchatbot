info:
  contact: {}
paths:
  /api/cdn/download/file:
    get:
      description: 根据 id、key 下载文件；size 可选，省略时自动识别大文件通道，由首片取得总长度。
      parameters:
      - description: CDN 文件 ID
        in: query
        name: id
        required: true
        type: string
      - description: AES 密钥
        in: query
        name: key
        required: true
        type: string
      - description: 原文大小
        format: int64
        in: query
        name: size
        type: integer
      - description: 下载文件名
        in: query
        name: name
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: CDN 下载聊天文件
      tags:
      - CDN
  /api/cdn/download/image:
    get:
      description: 根据 id 和 key 从 CDN 下载图片，响应正文为图片二进制。
      parameters:
      - description: CDN 文件 ID
        in: query
        name: id
        required: true
        type: string
      - description: AES 密钥
        in: query
        name: key
        required: true
        type: string
      - description: 原文大小
        format: int64
        in: query
        name: size
        type: integer
      - description: 下载文件名
        in: query
        name: name
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: CDN 下载聊天图片
      tags:
      - CDN
  /api/cdn/download/video:
    get:
      description: 根据 id、key 和可选 size 从 CDN 下载视频，响应正文为视频二进制。
      parameters:
      - description: CDN 文件 ID
        in: query
        name: id
        required: true
        type: string
      - description: AES 密钥
        in: query
        name: key
        required: true
        type: string
      - description: 原文大小；达到 25MiB 时走大视频分片协议
        format: int64
        in: query
        name: size
        type: integer
      - description: 下载文件名
        in: query
        name: name
        type: string
      produces:
      - video/*
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: CDN 下载聊天视频
      tags:
      - CDN
  /api/cdn/download/video_cover:
    get:
      description: 根据 id 和 key 从 CDN 下载视频封面，响应正文为图片二进制。
      parameters:
      - description: CDN 文件 ID
        in: query
        name: id
        required: true
        type: string
      - description: AES 密钥
        in: query
        name: key
        required: true
        type: string
      - description: 原文大小
        format: int64
        in: query
        name: size
        type: integer
      - description: 下载文件名
        in: query
        name: name
        type: string
      produces:
      - image/*
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: CDN 下载视频封面
      tags:
      - CDN
  /api/cdn/upload/file:
    post:
      consumes:
      - multipart/form-data
      description: 仅上传并返回 CDN 信息，无需接收者；内部使用当前账号取得上传授权。不超过 25MiB 走普通 CDN，超过 25MiB 自动走
        MPMC。文件名优先取 name，其次取上传文件名，最后取 URL 文件名。支持 multipart、表单或 JSON 请求体；JSON 示例：{"url":"https://example.com/file.zip"}。
      parameters:
      - description: 文件名（含扩展名），不传时自动识别
        in: formData
        name: name
        type: string
      - description: 文件 URL，与 file 至少提供一项
        in: formData
        name: url
        type: string
      - description: 文件，与 url 至少提供一项
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/cdnv3.UploadFileResult'
              type: object
      summary: CDN 上传文件
      tags:
      - CDN
  /api/cdn/upload/image:
    post:
      consumes:
      - multipart/form-data
      description: 仅上传并返回 CDN 信息，内部使用当前账号作为协议上下文。url、file 至少提供一项，优先使用上传文件，否则从 URL
        下载。支持 multipart、表单或 JSON 请求体；JSON 示例：{"url":"https://example.com/image.jpg"}。
      parameters:
      - description: 图片 URL，与 file 至少提供一项
        in: formData
        name: url
        type: string
      - description: 图片文件，与 url 至少提供一项
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/cdnv3.UploadImageResult'
              type: object
      summary: CDN 上传聊天图片
      tags:
      - CDN
  /api/cdn/upload/moments/image:
    post:
      consumes:
      - multipart/form-data
      description: 纯上传返回 CDN URL，可用于发朋友圈等场景。url、file 至少提供一项，优先使用上传文件。支持 multipart、表单或
        JSON 请求体；JSON 示例：{"url":"https://example.com/image.jpg"}。
      parameters:
      - description: 图片 URL，与 file 至少提供一项
        in: formData
        name: url
        type: string
      - description: 图片文件，与 url 至少提供一项
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/cdnv3.UploadMomentsImageResult'
              type: object
      summary: CDN 上传朋友圈图片
      tags:
      - CDN
  /api/cdn/upload/moments/video:
    post:
      consumes:
      - multipart/form-data
      description: 纯上传返回 CDN URL 和视频元数据，优先使用上传文件，未提供封面时自动提取。支持 multipart、表单或 JSON
        请求体；JSON 示例：{"video_url":"https://example.com/video.mp4"}。
      parameters:
      - description: 视频 URL，与 video_file 至少提供一项
        in: formData
        name: video_url
        type: string
      - description: 视频文件，与 video_url 至少提供一项
        in: formData
        name: video_file
        type: file
      - description: 可选封面 URL，未提供封面时自动提取
        in: formData
        name: thumb_url
        type: string
      - description: 可选封面文件，优先于 thumb_url
        in: formData
        name: thumb_file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/cdnv3.UploadMomentsVideoResult'
              type: object
      summary: CDN 上传朋友圈视频
      tags:
      - CDN
  /api/cdn/upload/video:
    post:
      consumes:
      - multipart/form-data
      description: 仅上传并返回 CDN 信息及视频尺寸、时长；未提供封面时自动提取。视频达到 25MiB 时自动使用 HTTP 分片与动态并发。支持
        multipart、表单或 JSON 请求体；JSON 示例：{"video_url":"https://example.com/video.mp4"}。
      parameters:
      - description: 视频 URL，与 video_file 至少提供一项
        in: formData
        name: video_url
        type: string
      - description: 视频文件，与 video_url 至少提供一项
        in: formData
        name: video_file
        type: file
      - description: 可选封面 URL，未提供封面时自动提取
        in: formData
        name: thumb_url
        type: string
      - description: 可选封面文件，优先于 thumb_url
        in: formData
        name: thumb_file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/cdnv3.UploadVideoResult'
              type: object
      summary: CDN 上传聊天视频
      tags:
      - CDN
  /api/chatroom:
    post:
      consumes:
      - application/json
      parameters:
      - description: 初始成员用户名数组
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/contactv3.CreateChatroomResponse'
              type: object
      summary: 创建群聊
      tags:
      - 群聊
  /api/chatroom/{chatroom}:
    delete:
      parameters:
      - description: 群 ID
        in: path
        name: chatroom
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/basev3.OperateResponse'
              type: object
      summary: 退出群聊
      tags:
      - 群聊
    get:
      parameters:
      - description: 普通群 ID
        in: path
        name: chatroom
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
