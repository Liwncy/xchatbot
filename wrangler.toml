name = "xchatbot"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# ══════════════════════════════════════════════════════════════════════════════
# 路由
# ══════════════════════════════════════════════════════════════════════════════
routes = [
    { pattern = "xbot.lwcfworker.dpdns.org", zone_name = "lwcfworker.dpdns.org", custom_domain = true }
]

# ══════════════════════════════════════════════════════════════════════════════
# 定时任务
# 必须写空数组再 deploy，注释掉 [triggers] 不会卸掉线上已有 cron。
# 恢复调度：改成 crons = ["*/5 * * * *"] 后再 deploy。
# ══════════════════════════════════════════════════════════════════════════════
[triggers]
crons = []

# ══════════════════════════════════════════════════════════════════════════════
# 可观测性
# ══════════════════════════════════════════════════════════════════════════════
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = false
head_sampling_rate = 1
persist = false
invocation_logs = false

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1

# ══════════════════════════════════════════════════════════════════════════════
# 系统绑定：KV / D1
# ══════════════════════════════════════════════════════════════════════════════
[[kv_namespaces]]
binding = "XBOT_KV"
id = "b9e4e9631e9849efb433441111db831f"

[[d1_databases]]
binding = "XBOT_DB"
database_name = "xbotdata"
database_id = "941571aa-a060-4d08-9cad-44b439b03c11"

# ══════════════════════════════════════════════════════════════════════════════
# 业务变量
# 密钥放 .dev.vars（本地）或 wrangler secret（线上），不要写进本文件。
# ══════════════════════════════════════════════════════════════════════════════
[vars]

# ── 机器人身份 ────────────────────────────────────────────────────────────────
BOT_NAME = "小聪明儿"
BOT_OWNER_WECHAT_ID = "wxid_5jfnhtqy74xr22"
BOT_OWNER_WECHAT_NAME = "李芈仙"
BOT_WECHAT_ID = "wxid_ahl9az25aljx22"
# BOT_WECHAT_NAME 已并入 BOT_NAME；没配 BOT_NAME 时仍可读这个
BOT_WECHAT_NAME = "小聪明儿"

# ── Golem / 微信通道 ──────────────────────────────────────────────────────────
# WECHAT_TOKEN（secret）
WECHAT_API_BASE_URL = "https://wxbot.lwcorspro.dpdns.org"

# ── 日志 ──────────────────────────────────────────────────────────────────────
CHAT_LOG_ENABLE = "true"
APP_LOG_ENABLE = "true"

# ── OpenClaw 频道 ─────────────────────────────────────────────────────────────
# AGENT_BRIDGE_BASE_URL / AGENT_BRIDGE_TOKEN（secret）
# 开启后 webhook 把已放行消息 POST 到 OpenClaw xbot inbound；回复走 /openclaw/outbound
XBOT_CHANNEL_ENABLED = "true"
XBOT_CHANNEL_AUTO_FORWARD = "true"
# XBOT_CHANNEL_GATEWAY_URL = "https://openclaw.example.com"
# XBOT_CHANNEL_GATEWAY_TOKEN（secret，默认同 AGENT_BRIDGE_TOKEN）
# XBOT_CHANNEL_TIMEOUT_MS = "120000"

# ── 大脑 ──────────────────────────────────────────────────────────────────────
# 未设或 openclaw 走 OpenClaw；snailai 走 SnailAI；qwenpaw 走 QwenPaw 频道插件。
# Worker 不能用 IP 直连（Cloudflare 1003），QwenPaw / SnailAI 都要域名。
AGENT_BRAIN = "openclaw"
# SNAIL_AI_BASE_URL = "http://snailai.example.com:8900"
# SNAIL_AI_APP_ID = "1"
# SNAIL_AI_PREFIX = "snail-ai"
# SNAIL_AI_AGENT_ID = "1"
# SNAIL_AI_TIMEOUT_MS = "180000"
# SNAIL_AI_TOKEN（secret）

# ── QwenPaw 频道 ──────────────────────────────────────────────────────────────
# QWENPAW_TOKEN（secret，未设则回退 AGENT_BRIDGE_TOKEN）
# AGENT_BRAIN = "qwenpaw"
# QWENPAW_BASE_URL = "https://summary-stronger-usual-automotive.trycloudflare.com"
# QWENPAW_TIMEOUT_MS = "120000"

# ── MCP ───────────────────────────────────────────────────────────────────────
MCP_TOOLS_URL = "https://mcp.lwcfworker.dpdns.org/mcp"
# 加别人的 MCP：catalog.ts 的 MCP_SERVERS 登记后，再在这里加 URL，token 用 secret。
XIUXIAN_PLATFORM = "agbot"

# ── Web 调试适配器 ────────────────────────────────────────────────────────────
# 上线前改成 false。
WEB_ADAPTER_ENABLED = "true"
# WEB_ADAPTER_TOKEN（secret，可选）

# silk-wasm：按二进制打包，Golem 发送前把 WAV/PCM 转成微信 SILK
[[rules]]
globs = ["**/*.wasm"]
type = "Data"
fallthrough = true
