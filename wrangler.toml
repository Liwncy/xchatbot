name = "xchatbot"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# ══════════════════════════════════════════════════════════════════════════════
# 路由
# ══════════════════════════════════════════════════════════════════════════════
routes = [
    { pattern = "xbot.lwcfworker.dpdns.org", zone_name = "lwcfworker.dpdns.org", custom_domain = true }
]

# ══════════════════════════════════════════════════════════════════════════════
# 定时任务
# 必须写空数组再 deploy，注释掉 [triggers] 不会卸掉线上已有 cron。
# 恢复调度：改成 crons = ["*/5 * * * *"] 后再 deploy。
# ══════════════════════════════════════════════════════════════════════════════
[triggers]
crons = []

# ══════════════════════════════════════════════════════════════════════════════
# 可观测性
# ══════════════════════════════════════════════════════════════════════════════
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = false
head_sampling_rate = 1
persist = false
invocation_logs = false

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1

# ══════════════════════════════════════════════════════════════════════════════
# 系统绑定：KV / D1
# ══════════════════════════════════════════════════════════════════════════════
[[kv_namespaces]]
binding = "XBOT_KV"
id = "b9e4e9631e9849efb433441111db831f"

[[d1_databases]]
binding = "XBOT_DB"
database_name = "xbotdata"
database_id = "941571aa-a060-4d08-9cad-44b439b03c11"

# ══════════════════════════════════════════════════════════════════════════════
# 业务变量
# 密钥放 .dev.vars（本地）或 wrangler secret（线上），不要写进本文件。
# ══════════════════════════════════════════════════════════════════════════════
[vars]

# ── 机器人身份 ────────────────────────────────────────────────────────────────
BOT_NAME = "小聪明儿"
BOT_OWNER_WECHAT_ID = "wxid_5jfnhtqy74xr22"
BOT_OWNER_WECHAT_NAME = "李芈仙"
BOT_WECHAT_ID = "wxid_ahl9az25aljx22"
# BOT_WECHAT_NAME 已并入 BOT_NAME；没配 BOT_NAME 时仍可读这个
BOT_WECHAT_NAME = "小聪明儿"

# ── Golem / 微信通道 ──────────────────────────────────────────────────────────
# WECHAT_TOKEN（secret）
WECHAT_API_BASE_URL = "https://wxbot.lwcorspro.dpdns.org"
# SILK_CONVERT_URL = "https://api.chrelyonly.cn/convert"  # 默认已用这个；设 off 则只用本地 wasm

# ── 日志 ──────────────────────────────────────────────────────────────────────
CHAT_LOG_ENABLE = "true"
APP_LOG_ENABLE = "true"

# ── 大脑 ──────────────────────────────────────────────────────────────────────
# 地址、token、默认在 D1 agent_brain。当前走哪颗在 KV。
# 这个开关管全部大脑，关掉就都不接。
XBOT_CHANNEL_ENABLED = "true"

# ── MCP ───────────────────────────────────────────────────────────────────────
MCP_TOOLS_URL = "https://mcp.lwcfworker.dpdns.org/mcp"
# 指令图截图。GATEWAY_API_KEY（secret，值与 cf-worker 的 GATEWAY_API_KEY 相同，以后调 cf-worker 都用这把）
SCREENSHOT_URL = "https://lwcfworker.dpdns.org/screenshot"
# 加别人的 MCP：catalog.ts 的 MCP_SERVERS 登记后，再在这里加 URL，token 用 secret。
XIUXIAN_PLATFORM = "agbot"

# ── Web 调试适配器 ────────────────────────────────────────────────────────────
# 上线前改成 false。
WEB_ADAPTER_ENABLED = "true"
# WEB_ADAPTER_TOKEN（secret，可选）

# ── 调试转发 ──────────────────────────────────────────────────────────────────
# 生产把 webhook / outbound / mcp 转到本地隧道。开关在 /admin/debug，默认 8 小时过期。
# ADMIN_TOKEN（secret，可选。设置后 /admin/debug 需要 Bearer）

# silk-wasm：部署时预编译，Worker 运行时不能从字节再编译 wasm
[[rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"
fallthrough = true
